<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>零用金報銷系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-12 antialiased">
  <header class="bg-amber-600 text-white p-4 shadow sticky top-0 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🧾</span>
        <h1 class="font-bold text-lg">零用金報銷申請</h1>
      </div>
      <button type="button" id="workerProfileBtn" onclick="openNameModal()" class="text-xs bg-amber-700 px-3 py-1.5 rounded-full text-white font-medium shadow active:scale-95 transition">
        點此設定身分
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- 師傅個人專屬餘額卡片 -->
    <div class="bg-slate-800 text-white rounded-2xl p-4 shadow-sm border border-slate-700">
      <div class="flex items-center justify-between text-xs text-slate-300 mb-1">
        <span id="balanceTitle">我的待結算零用金</span>
        <span id="balanceUpdateTime" class="text-[10px] text-slate-400">已就緒</span>
      </div>
      <div class="flex items-baseline gap-1 mt-1">
        <span id="myBalanceAmount" class="text-3xl font-extrabold text-amber-400">0</span>
        <span class="text-xs text-slate-300 font-medium">元</span>
      </div>
      <p id="balanceTip" class="text-[11px] text-slate-400 mt-1">主管審核通過後，餘額將自動更新</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
      <h2 class="text-base font-bold text-slate-700 border-b pb-2">✏️ 填寫報銷明細</h2>

      <div class="w-full overflow-hidden">
        <label class="block text-xs font-semibold text-slate-500 mb-1">花費日期</label>
        <input 
          type="date" 
          id="expenseDate" 
          class="w-full max-w-full box-border bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:ring-2 focus:ring-amber-500 outline-none" 
          style="-webkit-appearance: none; min-height: 44px;"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">金額 (元) <span class="text-rose-500">*</span></label>
        <div class="relative">
          <span class="absolute left-3 top-2.5 text-slate-400 font-bold">$</span>
          <input type="number" id="amount" placeholder="例如: 850" min="1" inputmode="numeric" class="w-full pl-8 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-base font-bold text-slate-800" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">支出類別</label>
        <select id="category" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium">
          <option value="五金材料">五金材料</option>
          <option value="餐費">餐費 / 便當 / 飲料</option>
          <option value="油資">油資 / 停車費</option>
          <option value="工具採購">工具採購</option>
          <option value="其他">其他雜項</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">用途明細 / 備註</label>
        <input type="text" id="note" placeholder="例如: 中午便當 5 個、買螺絲" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">
          收據 / 發票照片 <span class="text-slate-400 font-normal">（選填，便當/無單據可免附）</span>
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />
        <div id="uploadBox" onclick="document.getElementById('cameraInput').click()" class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center cursor-pointer bg-slate-50">
          <div id="uploadPlaceholder" class="space-y-1">
            <div class="text-3xl text-slate-400">📸</div>
            <p class="text-xs font-medium text-slate-600">點此拍照或選擇相簿（若無單據可免附）</p>
            <p class="text-[10px] text-slate-400">系統自動壓縮，不佔空間</p>
          </div>
          <div id="previewContainer" class="hidden relative">
            <img id="previewImage" class="w-full h-44 object-cover rounded-lg shadow-inner mx-auto" />
            <button type="button" onclick="event.stopPropagation(); removePhoto();" class="absolute top-1 right-1 bg-black/60 text-white rounded-full w-6 h-6 text-xs">✕</button>
            <p id="compressStatus" class="text-[10px] text-emerald-600 mt-1 font-medium"></p>
          </div>
        </div>
      </div>

      <button type="button" id="submitBtn" onclick="submitClaim()" class="w-full bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold py-3.5 rounded-xl shadow-md transition">
        送出報銷申請
      </button>
    </div>

    <div class="space-y-2">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">我的近期報銷紀錄</h3>
        <button type="button" onclick="loadMyClaims()" class="text-xs text-amber-600 font-medium">重整清單</button>
      </div>
      <div id="claimsList" class="space-y-2.5">
        <div class="text-center py-6 text-xs text-slate-400">尚無報銷紀錄</div>
      </div>
    </div>
  </main>

  <!-- 姓名設定彈窗 -->
  <div id="nameModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="text-center space-y-1">
        <h3 class="font-bold text-lg text-slate-800">設定報銷人身分</h3>
        <p class="text-xs text-slate-500">請輸入真實姓名，方便主管核准對帳</p>
      </div>
      <div>
        <input type="text" id="nameInput" placeholder="例如：彭士偉、許老邊、Benjamin" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-3 text-base text-center font-bold text-slate-800 outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div class="flex gap-2">
        <button type="button" onclick="closeNameModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-2.5 rounded-xl text-sm">取消</button>
        <button type="button" onclick="confirmNameModal()" class="flex-1 bg-amber-600 text-white font-bold py-2.5 rounded-xl text-sm shadow">確定儲存</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCQ98ZWCCOk7ALopTQKjpizcgeyiRu12_I",
      authDomain: "payroll-attendance-da6b1.firebaseapp.com",
      projectId: "payroll-attendance-da6b1",
      storageBucket: "payroll-attendance-da6b1.firebasestorage.app",
      messagingSenderId: "697411530182",
      appId: "1:697411530182:web:82a967282a51148c0016c7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    const MY_LIFF_ID = "2011667192-nB1wlENX";

    // 安全讀取 LocalStorage（避免空值或髒資料卡死）
    function getCleanStorage(key) {
      const v = localStorage.getItem(key);
      if (!v || v === "null" || v === "undefined" || v.trim() === "" || v === "師傅" || v === "離線師傅") {
        return "";
      }
      return v.trim();
    }

    let currentUserId = getCleanStorage("petty_cash_uid") || ("user_" + Date.now());
    let currentUserName = getCleanStorage("petty_cash_name");
    let compressedImageBlob = null;
    let balanceUnsubscribe = null;

    function openNameModal() {
      document.getElementById("nameInput").value = currentUserName || "";
      document.getElementById("nameModal").classList.remove("hidden");
    }

    function closeNameModal() {
      document.getElementById("nameModal").classList.add("hidden");
    }

    function confirmNameModal() {
      const val = document.getElementById("nameInput").value.trim();
      if (!val) {
        alert("請輸入姓名");
        return;
      }
      currentUserName = val;
      localStorage.setItem("petty_cash_name", currentUserName);
      closeNameModal();
      applyUserIdentity();
    }

    function applyUserIdentity() {
      if (currentUserName) {
        document.getElementById("workerProfileBtn").innerText = "👷 " + currentUserName;
        document.getElementById("balanceTitle").innerText = currentUserName + " 的待結算零用金";
        loadMyBalance();
        loadMyClaims();
      } else {
        document.getElementById("workerProfileBtn").innerText = "點此設定身分";
        document.getElementById("balanceTitle").innerText = "我的待結算零用金";
      }
    }

    window.addEventListener("DOMContentLoaded", function() {
      // 1. 設定今日花費日期
      try {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById("expenseDate").value = y + "-" + m + "-" + d;
      } catch (e) {}

      // 2. 若已有儲存的身分，立刻套用
      if (currentUserName) {
        applyUserIdentity();
      }

      // 3. 背景執行 LIFF，若無身分則主動彈窗
      initAppAsync();
    });

    async function initAppAsync() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUserId = profile.userId;
          localStorage.setItem("petty_cash_uid", currentUserId);

          if (!currentUserName) {
            let matchedName = profile.displayName || "";
            try {
              const snap = await db.collection("check_ins").where("lineUserId", "==", currentUserId).limit(1).get();
              if (!snap.empty && snap.docs[0].data().displayName) {
                matchedName = snap.docs[0].data().displayName;
              }
            } catch (e) {}

            if (matchedName) {
              currentUserName = matchedName;
              localStorage.setItem("petty_cash_name", currentUserName);
            }
          }
        }
      } catch (err) {
        console.warn("LIFF 啟用略過:", err);
      }

      if (currentUserName) {
        applyUserIdentity();
      } else {
        // 沒有身分時主動彈窗
        openNameModal();
      }
    }

    // 即時監聽餘額
    function loadMyBalance() {
      if (balanceUnsubscribe) { balanceUnsubscribe(); }
      const balanceEl = document.getElementById("myBalanceAmount");
      const tipEl = document.getElementById("balanceTip");
      const timeEl = document.getElementById("balanceUpdateTime");

      if (!currentUserName) return;

      try {
        balanceUnsubscribe = db.collection("worker_balances").doc(currentUserName)
          .onSnapshot(function(doc) {
            if (doc.exists) {
              const bal = doc.data().balance || 0;
              if (bal < 0) {
                balanceEl.innerText = String(Math.abs(bal));
                balanceEl.className = "text-3xl font-extrabold text-rose-400";
                tipEl.innerText = "主管待撥付 / 待補款給您";
              } else if (bal > 0) {
                balanceEl.innerText = "+" + bal;
                balanceEl.className = "text-3xl font-extrabold text-emerald-400";
                tipEl.innerText = "手頭預撥零用金餘額";
              } else {
                balanceEl.innerText = "0";
                balanceEl.className = "text-3xl font-extrabold text-slate-200";
                tipEl.innerText = "款項已全數結清沖銷";
              }
              timeEl.innerText = "即時連線";
            } else {
              balanceEl.innerText = "0";
              balanceEl.className = "text-3xl font-extrabold text-slate-200";
              tipEl.innerText = "尚無核銷餘額紀錄";
              timeEl.innerText = "已就緒";
            }
          }, function(err) {
            console.warn("餘額讀取警告:", err);
          });
      } catch (e) {}
    }

    // 拍照壓縮
    document.getElementById("cameraInput").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 1280;
          let width = img.width, height = img.height;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(function(blob) {
            compressedImageBlob = blob;
            document.getElementById("previewImage").src = URL.createObjectURL(blob);
            document.getElementById("uploadPlaceholder").classList.add("hidden");
            document.getElementById("previewContainer").classList.remove("hidden");
            document.getElementById("compressStatus").innerText = "發票已壓縮至: " + Math.round(blob.size / 1024) + " KB";
          }, "image/jpeg", 0.75);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function removePhoto() {
      compressedImageBlob = null;
      document.getElementById("cameraInput").value = "";
      document.getElementById("previewContainer").classList.add("hidden");
      document.getElementById("uploadPlaceholder").classList.remove("hidden");
    }

    // 送出報銷單
    async function submitClaim() {
      const expenseDate = document.getElementById("expenseDate").value;
      const amount = parseFloat(document.getElementById("amount").value);
      const category = document.getElementById("category").value;
      const note = document.getElementById("note").value.trim();

      if (!expenseDate) return alert("請選擇花費日期");
      if (!amount || amount <= 0) return alert("請輸入正確金額");

      if (!currentUserName) {
        openNameModal();
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;

      try {
        const claimId = "claim_" + Date.now();
        let imageUrl = "";
        let storagePath = "";

        if (compressedImageBlob) {
          submitBtn.innerText = "上傳照片中...";
          const monthFolder = expenseDate.substring(0, 7).replace("-", "");
          storagePath = "receipts/" + monthFolder + "/" + claimId + ".jpg";

          const storageRef = storage.ref(storagePath);
          const snapshot = await storageRef.put(compressedImageBlob, { contentType: "image/jpeg" });
          imageUrl = await snapshot.ref.getDownloadURL();
        }

        submitBtn.innerText = "儲存單據中...";

        await db.collection("petty_cash_claims").doc(claimId).set({
          id: claimId,
          workerName: currentUserName,
          lineUserId: currentUserId,
          expenseDate: expenseDate,
          amount: amount,
          category: category,
          note: note,
          receiptImageUrl: imageUrl || "",
          receiptStoragePath: storagePath || "",
          status: "pending",
          rejectReason: "",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("✅ 報銷單已成功送出，等待主管審核！");
        document.getElementById("amount").value = "";
        document.getElementById("note").value = "";
        removePhoto();
        loadMyClaims();
      } catch (err) {
        alert("⚠️ 送出失敗: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "送出報銷申請";
      }
    }

    // 載入紀錄
    async function loadMyClaims() {
      const listEl = document.getElementById("claimsList");
      if (!currentUserName) {
        listEl.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">請先設定身分後查看紀錄</div>';
        return;
      }

      try {
        const snapshot = await db.collection("petty_cash_claims")
          .where("workerName", "==", currentUserName)
          .limit(20)
          .get();

        if (snapshot.empty) {
          listEl.innerHTML = '<div class="text-center py-6 text-xs text-slate-400 bg-white rounded-xl border border-slate-200">尚無 ' + currentUserName + ' 的報銷紀錄</div>';
          return;
        }

        let claims = [];
        snapshot.forEach(function(doc) { claims.push(doc.data()); });
        claims.sort(function(a, b) { return (b.expenseDate > a.expenseDate ? 1 : -1); });

        let html = "";
        claims.forEach(function(c) {
          let badge = c.status === "pending" ? '<span class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded">待審核</span>'
                    : c.status === "approved" ? '<span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded">已沖銷</span>'
                    : '<span class="bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-0.5 rounded">已退回</span>';

          let actionBtn = c.status === "pending"
            ? '<button onclick="cancelClaim(\'' + c.id + '\')" class="text-xs text-rose-500 border border-rose-200 bg-rose-50 px-2 py-1 rounded-lg">撤回</button>' : "";

          let receiptLink = c.receiptImageUrl 
            ? '<a href="' + c.receiptImageUrl + '" target="_blank" class="text-xs text-blue-500 underline">看收據</a>'
            : '<span class="text-xs text-slate-400">無單據</span>';

          html += `
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-slate-700">${c.expenseDate}</span>
                  <span class="text-xs bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${c.category}</span>
                  ${badge}
                </div>
                <div class="text-sm font-extrabold text-slate-800">$${c.amount} <span class="text-xs font-normal text-slate-500">(${c.note || '無備註'})</span></div>
                ${c.rejectReason ? `<div class="text-xs text-rose-500">理由: ${c.rejectReason}</div>` : ''}
              </div>
              <div class="flex flex-col items-end gap-1.5 flex-shrink-0">
                ${receiptLink}
                ${actionBtn}
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;
      } catch (err) {
        listEl.innerHTML = '<div class="text-center py-4 text-xs text-rose-500">載入失敗: ' + err.message + '</div>';
      }
    }

    async function cancelClaim(claimId) {
      if (!confirm("確定要撤回這筆報銷申請嗎？")) return;
      try {
        await db.collection("petty_cash_claims").doc(claimId).update({
          status: "cancelled"
        });
        alert("已撤回該單據！");
        loadMyClaims();
      } catch (err) {
        alert("撤回失敗: " + err.message);
      }
    }
  </script>
</body>
</html>
